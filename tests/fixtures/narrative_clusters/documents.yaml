      We achieved a new milestone in qubit fidelity this quarter, advancing our quantum
      computing roadmap toward commercially useful quantum computing applications.
  - ticker: IONQ
    source_type: news
    source_id: IONQ-news-1
    published_at: "2026-06-03T00:00:00"
    text: >
      The quantum computing company announced a breakthrough in qubit error correction,
      a key step toward scalable quantum computing hardware.
  - ticker: RGTI
    source_type: earnings_transcript
    source_id: RGTI-transcript-1
    published_at: "2026-06-02T00:00:00"
    text: >
      Our quantum computing chip achieved higher qubit coherence times, supporting our
      quantum computing roadmap and near-term quantum computing commercial contracts.
  - ticker: RGTI
    source_type: sec_filing
    source_id: RGTI-filing-1
    published_at: "2026-06-05T00:00:00"
    text: >
      Risk factors include the pace of qubit fidelity improvement required for
      commercially viable quantum computing systems.
  - ticker: QBTS
    source_type: news
    source_id: QBTS-news-1
    published_at: "2026-06-04T00:00:00"
    text: >
      The quantum computing firm demonstrated a new qubit annealing approach, advancing
      quantum computing toward practical optimization applications.
  - ticker: QBTS
    source_type: earnings_transcript
    source_id: QBTS-transcript-1
    published_at: "2026-06-06T00:00:00"
