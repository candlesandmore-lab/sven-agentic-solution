      - item: Documentation-quality notes from the implementation-spec pass -
          explain why MaskingFilter clears record.args, note why mask_sensitive
          re-reads os.environ per call, state MASKED_ENV_VARS's module location
          and extension responsibility, and cross-reference 'unified error
