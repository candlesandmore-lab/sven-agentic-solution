schema_version: 1
story:
  id: 1
  title: Narrative-Cluster Discovery Surface
  state: active
  created_on: 2026-07-08
  last_updated_on: 2026-07-08
  source_todo:
    - development/todos/001-trial-US-015.md
  actor: human trader
  goal: >
    When reviewing narrative or topic findings drawn from earnings reports, SEC filings, and
    news coverage, the human trader sees tickers grouped into clusters by shared or adjacent
    narrative, independent of whether any pair bond or sync signal exists between them and
    independent of existing theme membership. For each cluster the human trader can see which
    storyline or topic ties it together, and how its frequency of mention or company breadth is
    trending. From a cluster the human trader can move directly into a side-by-side chart
    inspection of its members to assess whether to create a theme from it (STR-011).
  success_criteria:
    - Extract narratives and topics from earnings reports, SEC filings, and news coverage per
      ticker using the FMP data provider, refreshed on a nightly batch cadence.
    - Group tickers into clusters via topic modeling on extracted narratives, based on shared or
      overlapping topics, independent of whether a pair bond or sync signal exists between them,
      and independent of existing theme membership.
    - For each cluster, display a short topic label or summary of the storyline that ties it
      together, and how its frequency of mention or company breadth is trending.
    - Enable the human trader to move directly from a cluster into a side-by-side chart
      inspection of its members.
    - Theme creation from a narrative cluster remains the human trader's discretionary judgment
      made after chart inspection; the Technical Trader Solution must never automatically create
      a theme from narrative clustering alone.
  architecture_options:
    - option: Fixed nightly pipeline (fetch from FMP, extract, topic-model, label, persist),
        classified solution_surface coded_agent, feeding a separate Discovery Surface
        presentation component. Chosen; see docs/architecture/01-technical-trader-solution.md
        Operating Decision Record.
      alternatives_considered:
        - Flexible/exploratory frontier-reasoning step judging narrative connections case by
          case; rejected as too slow and costly to run nightly across the full eligible
          universe, confirmed with the human trader on 2026-07-08.
        - Fixed pipeline now with a flexible reasoning step deferred to a follow-up story;
          available if the fixed pipeline later proves too coarse for a narrow ticker subset.
  implementation_options:
    - option: Use the FMP API to source raw earnings reports, SEC filings, and news for target
        tickers on a nightly batch cadence. Apply topic modeling to derive narrative clusters
        from extracted per-ticker findings. Integrate cluster results into the Technical Trader
        Solution with interactive, side-by-side chart visualization. See
        docs/implementation/01-narrative-cluster-discovery-surface.md for the full data
        contracts, storage, and interface specification.
      alternatives_considered:
        - Custom API-plus-frontend build for the Discovery Surface page; rejected in favor of
          Streamlit for faster delivery of an interactive, Python-native page reusing the
          pipeline's own data-access functions directly.
        - BERTopic chosen as the topic-modeling library over classic LDA and scikit-learn NMF
          (weaker embedding-based semantic similarity, more manual tuning); see
          docs/implementation/01-narrative-cluster-discovery-surface.md Topic-Modeling Library.
    - option: Local web dashboard as the Technical Trader Solution's delivery interface (chosen
        with the human trader on 2026-07-08); see
        docs/architecture/01-technical-trader-solution.md Delivery Interface.
      alternatives_considered:
        - CLI plus notebook workflow; rejected as more manual for interactive chart inspection.
        - Plug into an existing third-party charting platform; rejected to avoid an external
          platform dependency for the first capability.
  repository_context:
    branch: sven_input
    base_commit: 98606b1622f93af7aec090557993d53c3143f62c
  current_implementation:
    architecture_document: docs/architecture/01-technical-trader-solution.md
    implementation_document: docs/implementation/01-narrative-cluster-discovery-surface.md
  guidelines:
    - All clustering is based strictly on shared or adjacent narrative/topic, without regard to
      quantitative pair bonds, sync signals, or existing theme membership (MB-013's reverse path).
    - Cluster tickers using topic modeling over extracted narrative findings, grouping by shared
      or overlapping dominant topics.
    - Narrative extraction and cluster surfacing refresh on the same nightly batch cadence as the
      existing bond-network computation.
    - Each cluster's storyline is displayed as a short topic label or summary, not full quoted
      excerpts or raw headlines.
    - Narrative clustering alone never creates a theme, per STR-011 - a theme is created only
      once the human trader inspects the clustered tickers' charts and confirms a sufficient
      portion shows a similar rhythm, price direction, or other discretionary chart
      characteristic.
    - The narrative extraction workflow should be extensible to other narrative sources as
      needed, supporting the cluster-driven human trader workflow.
  impact_analysis:
    methodology: >
      Exploits MB-013 (Narrative Formation) via STR-011 (Narrative-Led Cluster Discovery,
      Chart-Confirmed into a Theme): narrative convergence across a group of tickers can precede
      any sync-threshold crossing and constitutes an alternative theme-genesis path alongside the
      usual sync-first path; per-ticker narrative findings narrow investigation of what connects
      a candidate group independent of how it first surfaced. Chart-level human trader
      confirmation remains required before any theme is created; narrative strength alone never
      creates a theme.
    architecture: Encourages separation of concerns between nightly narrative extraction,
      topic-modeling clustering, and UI exposure.
    implementation: Topic-modeling-driven narrative grouping may expose tickers to cross-sectoral
      patterns invisible in traditional pair or theme-based analytics.
  development_cycle:
