schema_version: 1
story:
  id: 2
  title: Enhance technical_trader_solution with robust error handling and logging
    across all user surfaces
  state: implemented
  created_on: 2026-07-14
  last_updated_on: 2026-07-14
  source_todo:
    - development/todos/002-enhance-error-and-logging.md
  actor: agentic-developer
  goal: >
    Enhance the technical_trader_solution to implement robust error handling and
    structured logging across all user interfaces and core layers, providing clear
    diagnostics and supporting operational debugging.
  success_criteria:
    - The core and flow logic of technical_trader_solution remain unchanged, aside
      from error handling and logging instrumentation.
    - All control and data flow operations are logged in a log file located in
      technical_trader_solution/ by default, overridable via a --log-dir parameter
      standardized across CLI, SDK, MCP, and dashboard surfaces.
    - Error handling is implemented with unified, clear error messages across CLI,
      MCP, SDK API, and the Streamlit dashboard, and exceptions are properly raised
      on the SDK API.
    - Python standard logging with customizable configuration is used; no new
      dependencies are introduced, and logs accumulate without retention or
      rotation by default.
    - Sensitive fields (API keys, credentials, PII) are never logged in plaintext;
      the logging system supports a masked-fields list to ensure proper redaction.
  architecture_options:
    - option: Use Python's built-in logging module with a project-specific
        configuration, including a file handler and customizable formatters per
        surface.
    - option: Integrate error handling using try/except structures at all public
        interface boundaries (CLI entrypoints, SDK API, MCP server endpoints,
        Streamlit dashboard event handlers), propagating exceptions as
        appropriate.
  implementation_options:
    - option: Add a --log-dir parameter to CLI, MCP server, and Streamlit dashboard
        launch scripts, defaulting log file storage to a technical_trader_solution/
        subdirectory in the current working directory, matching agent-dev-agent
        conventions.
    - option: Apply redaction/masking automatically for any field listed in a
        centralized masked-fields list before writing to logs, and ensure error
        message templates avoid leaking sensitive values.
    - option: Do not implement any log retention, rotation, or cleanup; manual
        cleanup only, per guidelines.
  repository_context:
    branch: sven_input
    base_commit: 5df55a1b5e8f65fa4a2a9ddba624c7a6a75130a4
  current_implementation:
    architecture_document: docs/architecture/01-technical-trader-solution.md
    implementation_document: docs/implementation/02-logging-and-error-handling.md
  guidelines:
    - Retain existing technical_trader_solution logic - do not alter behavior,
      only add observability and error handling.
    - Apply error message formatting consistently across CLI, MCP, SDK, and
      dashboard surfaces.
    - Define and document the exact masked-fields list as a deferred item for
      implementation planning.
    - No log retention or rotation - logs are append-only and cleaning is manual.
    - Store logs in a configurable directory, defaulting to
      technical_trader_solution/.
    - Use one canonical term, 'technical_trader_solution', throughout code, docs,
      and user surfaces; do not use 'technical trader solution' as an alias.
  impact_analysis:
    methodology: >
      Instrument all control and data flow operations with logging, and insert
      structured error handling paths at all user input and API boundaries.
    architecture: >
      Extend technical_trader_solution architecture with cross-cutting logging and
      error handling layers, relying only on Python stdlib facilities.
    implementation: >
      Affects CLI (src/technical_trader_solution/cli/), SDK API
      (src/technical_trader_solution/sdk/), MCP interface
      (src/technical_trader_solution/mcp/), and the Streamlit dashboard
      (src/technical_trader_solution/dashboard/). Exact file paths to be finalized
      during the architecture and implementation-spec phases of the flow, not at
      story-draft time.
  development_cycle:
    steps:
      - Design cross-surface logging and error handling patterns based on analysis
        of all public interfaces.
      - Implement logging configuration and file management according to
        guidelines and standards.
      - Add error handling (try/except) and message templating logic at CLI, SDK,
        MCP, and dashboard entrypoints.
      - Integrate field masking/redaction for sensitive data into logging
        functions.
      - Test unified error messages and log outputs on all four surfaces.
      - >-
        Architecture update (owner architect-planning-agent via the planning skill)
        -- added a Logging and Error Handling cross-cutting section to
        docs/architecture/01-technical-trader-solution.md (v0.3), covering the
        shared log file location and --log-dir override across CLI/SDK/MCP/
        dashboard, layered exception handling per surface (core raises and logs,
        SDK passes through, CLI logs+stderr+non-zero exit, MCP reports in tool
        response, dashboard shows in-page error), unified CLI/MCP error-message
        formatting, and deferred masked-fields specification. change_type is
        update; affected_documents is docs/architecture/01-technical-trader-solution.md;
        downstream_impacts are the implementation-spec update for CLI/SDK/MCP/
        dashboard error and logging contracts, and code changes across
        core/cli/sdk/mcp/dashboard.
      - >-
        task_1_logging_and_errors_core through task_5_dashboard_wiring (owner
        python-creation-agent, solution_surface instructed_agent_only) --
        extended technical_trader_solution/logging.py (TTS_RUN_TIMESTAMP
        inherited-environment-variable run-timestamp coordination, MASKED_ENV_VARS
        allowlist, mask_sensitive, MaskingFilter attached to handlers and mirrored
        onto the root logger plus httpx/httpcore on first use, log_dir creation
        for default and caller-supplied paths, log_level validation raising
        ConfigurationError); added technical_trader_solution/errors.py
        (TechnicalTraderSolutionError, DataProviderError, InvalidClusterError,
        ConfigurationError, format_error_message implementing the Unified Error
        Message Format); wired --log-dir/--log-level on the tts root click.group
        and domain-exception handling on narrative CLI commands; added
        sdk.configure_logging() and InvalidClusterError for a never-existed
        cluster_id in get_cluster_trend; moved configure_logger to run before
        FastMCP construction in mcp/server.py and wrapped each MCP tool to return
        an error-keyed dict carrying the unified message on a domain exception;
        renamed --log-file to --log-dir and added TTS_RUN_TIMESTAMP subprocess-env
        propagation in cli/dashboard.py, wrapping each dashboard SDK call to
        render the unified message via st.error(...)/st.warning(...). Folded the
        pre-existing FMPCredentialError classes into ConfigurationError and
        wrapped httpx.HTTPError at both FMP call sites into DataProviderError,
        without changing narrative-clusters' computed outputs.
      - >-
        task_6_qa_validation (owner qa-agent via coded_agent_invoke, task
        qa-story-002-v1) -- added tests/unit/test_logging.py (10 tests) and
        tests/unit/test_errors.py (4 tests), plus one InvalidClusterError
        interface test each to the SDK, CLI, and MCP test files, none requiring
        an API key. Full suite -- 46 passed, 1 skipped (FMP_API_KEY not
        configured) -- via the MCP pytest execution surface; yaml-check on the
        story and task-plan files passed. Verified end to end beyond tests: ran
        the real tts CLI against an unknown cluster_id via the MCP Python
        execution surface, confirming the masked log line, the exact Unified
        Error Message Format on stderr, and a non-zero exit; confirmed the root
        logger carries masked handlers and httpx.propagate=False before FastMCP
        construction completes; confirmed CLI argument-parse-time rejection of
        an invalid --log-level. developer_approval_required was true for the
        dashboard's three error-handling call sites (verified by direct code
        review, not an automated browser demo); the human trader accepted
        code-inspection evidence for this contained change, approval granted
        2026-07-14.
      - >-
        task_7_final_review (owner review-validation-agent via
        coded_agent_invoke, task review-story-002-task7-final-v1) -- final
        review gate across code, tests, demo evidence, and documentation
        alignment. Passed clean: all five success criteria confirmed
        demonstrably met; docs/architecture/01-technical-trader-solution.md v0.5
        and docs/implementation/02-logging-and-error-handling.md v0.3 confirmed
        to match the shipped code exactly, no drift; the task plan's 7 tasks
        confirmed complete; working tree confirmed clean. 9 findings, all
        informational; no blocking, important, or minor issues. Story moved
        from active to implemented.
    review_findings:
      - severity: blocking
        finding: Ambiguous term - 'technical_trader_solution' vs. 'technical trader
          solution' used inconsistently.
        resolution: Standardized on 'technical_trader_solution' throughout the
          story (task review-story-002-draft-v1, 2026-07-14).
      - severity: blocking
        finding: Contradiction between 'do not alter trading logic' and 'log
          control/data flow operations'.
        resolution: Reworded guideline to explicitly permit observability
          instrumentation that does not change trading logic behavior or outputs
          (task review-story-002-draft-v1, 2026-07-14).
      - severity: blocking
        finding: impact_analysis did not enumerate any implementation surfaces.
        resolution: impact_analysis.implementation now enumerates CLI, SDK, MCP,
          and dashboard at a coarse level, explicitly deferring exact file paths to
          the architecture and implementation-spec phases (task
          review-story-002-draft-v1, 2026-07-14).
      - severity: blocking
        finding: Repository context base_commit could not be verified as the
          actual current commit from the review agent's perspective.
        resolution: Confirmed base_commit was read directly from the live
          repository via the git MCP tool immediately before drafting and is the
          actual current HEAD of sven_input (task review-story-002-draft-v1,
          2026-07-14).
      - severity: important
        finding: Story did not include a solution-surface classification section.
        resolution: Clarified that solution-surface classification belongs to flow
          step 9 (Solution-surface classification), not the story-draft checkpoint;
          confirmed by the review agent on re-submission (task
          review-story-002-draft-v2, 2026-07-14).
      - severity: info
        finding: Story-draft review checkpoint re-run after the above resolutions.
        resolution: >
          Passed clean (task review-story-002-draft-v2, 2026-07-14): terminology
          consistency, non-contradictory guidelines, coarse-grained impact_analysis
          with explicit deferral of file-level detail, verified repository
          context, and the mandatory logging/error-handling cross-cutting
          guardrail all confirmed satisfied. 12 findings, all informational; no
          blocking, important, or minor issues. open_questions empty.
      - severity: info
        finding: Story lifecycle transition open -> active.
        resolution: Branch was clean at transition time (task review-story-002-draft-v2
          committed prior); moved development/backlog/open/002-enhance-error-and-logging.yaml
          to development/backlog/active/002-enhance-error-and-logging.yaml, 2026-07-14.
      - severity: blocking
        finding: Architecture v0.3 masked-fields deferral lacked an explicit safety
          rationale, and dashboard's --log-dir exposure contradicted the CLI/SDK/MCP
          entrance-API definition (task review-story-002-architecture-v1, 2026-07-14).
        resolution: >
          Architecture v0.4 added explicit deferral rationale for the masked-fields
          decision and classified the dashboard as a UI layer over the SDK (not a
          fourth entrance API), inheriting --log-dir/--log-level through its SDK
          dependency and additionally exposing both on its own launch command.
      - severity: important
        finding: Architecture v0.3 left log-file naming, --log-level, and the unified
          message-format deferral unspecified (task review-story-002-architecture-v1,
          2026-07-14).
        resolution: >
          Architecture v0.4 adopted technical_trader_solution_<datetime>.log naming,
          added --log-level [info, debug, warning, error] (default info) alongside
          --log-dir, and made the message-template deferral to implementation-spec
          explicit with rationale.
      - severity: info
        finding: Architecture review gate re-run after the above resolutions.
        resolution: >
          Passed clean (task review-story-002-architecture-v2, 2026-07-14): both
          blocking findings and all three important findings confirmed resolved;
          alignment with agent-dev-agent's own Logging And Error Handling Rules
          confirmed. One minor, deferrable finding (confirm 'domain exceptions' is
          the canonical term across the document set) checked directly -- no
          competing term exists elsewhere in docs/ or the story file; first use is
          canonical. docs/architecture/01-technical-trader-solution.md now at v0.4.
      - severity: blocking
        finding: Implementation-spec v0.1 (new docs/implementation/02-logging-and-error-handling.md)
          left the log-file run-timestamp coordination, masking-filter installation
          surface, and SDK configure_logger ownership contradictory or underspecified
          (task review-story-002-implspec-v1, 2026-07-14).
        resolution: >
          v0.2 added TTS_RUN_TIMESTAMP inherited-environment-variable coordination
          (including dashboard-subprocess env propagation), specified the masking
          filter's installation surface, and replaced SDK log_dir/log_level kwargs
          with a dedicated sdk.configure_logging() entry point.
      - severity: blocking
        finding: Implementation-spec v0.2's masked-fields scan scope (broad os.environ
          substring match) risked false-positive masking of unrelated third-party
          environment variables, and the root-logger filter/FastMCP initialization
          order was underspecified (task review-story-002-implspec-v2, 2026-07-14).
        resolution: >
          v0.3 replaced the broad scan with an explicit MASKED_ENV_VARS allowlist
          (FMP_API_KEY, ANTHROPIC_API_KEY), specified the MaskingFilter is attached
          to handlers (not the Logger object) and mirrored onto the root logger's
          handlers on first use, and required every entry point (including the MCP
          server) to call configure_logger before constructing any third-party
          client or server object such as FastMCP.
      - severity: info
        finding: Implementation-spec review gate re-run after the above resolutions.
        resolution: >
          Passed clean (task review-story-002-implspec-v3, 2026-07-14): all five
          prior blocking/important findings confirmed resolved. Four new info/minor
          findings recorded as deferrable documentation-quality notes (MaskingFilter
          record.args-clearing rationale, mask_sensitive re-read performance
          rationale, MASKED_ENV_VARS extension location/responsibility, and a
          cross-reference for 'unified error message') -- accepted as deferred, not
