          docs/implementation/02-logging-and-error-handling.md now at v0.3;
          docs/README.md's implementation document index updated in the same story.
      - severity: blocking
        finding: Task-plan v1 missing explicit invocation_surfaces rationale
          clarity, MCP execution-surface compliance statements, run-timestamp
          nested-process coordination allocation, third-party logger redirection
          allocation, and architecture v0.5 abstraction-alignment confirmation
          (task review-story-002-taskplan-v1, 2026-07-14).
        resolution: >
          Task-plan v2 resolved all five: clarified invocation_surfaces rationale
          is null because status is generated not omitted; added explicit MCP
          execution-surface compliance statements to task_1/task_6 and
          completion_conditions; allocated TTS_RUN_TIMESTAMP coordination and a
          nested-process reuse test to task_1/task_6; allocated third-party
          logger (httpx/httpcore) redirection via root-logger handler mirroring
          to task_1 with a propagation test in task_6; and this review pass
