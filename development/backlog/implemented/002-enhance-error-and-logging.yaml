          and extension responsibility, and cross-reference 'unified error
          message' to its defining section.
        reason: All four marked defer_allowed=true (info/minor); do not change
          the implementation contract, only documentation clarity (task
          review-story-002-implspec-v3, 2026-07-14). Not applied inline; left as
          a non-blocking documentation-polish opportunity for a future pass.
      - item: The Streamlit dashboard's error-handling call sites were verified
          by direct code review rather than an automated browser-driven demo
          (unlike story 001's Playwright demo).
        reason: Developer-approved as sufficient evidence for this contained
          change (three existing SDK calls wrapped in try/except plus
          st.error(...), no new UI); a future story that changes the dashboard's
          UI more substantially should invest in a browser-driven demo again.
  open_questions: []
