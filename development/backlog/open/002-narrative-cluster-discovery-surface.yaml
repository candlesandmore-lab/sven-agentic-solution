schema_version: 1
story:
  id: 002
  title: Narrative-Cluster Discovery Surface
  state: open
  created_on: 2026-07-07
  last_updated_on: 2026-07-07
  source_todo: development/todos/001-trial-US-015.md
  actor: human trader
  goal: >
    Give the human trader a discovery surface that groups narrative references from
    earnings reports, SEC filings, and news coverage into clusters by shared or
    adjacent storyline, so the trader can inspect them before deciding whether to
    create a theme. The first implementation must also establish an agentic workflow
    that extracts narrative findings from those sources through the FMP data provider.
  success_criteria:
    - The Technical Trader Solution surfaces narrative clusters that are independent of pair-bond and sync-state presence.
    - The workflow extracts narrative findings from earnings reports, SEC filings, and news coverage through the FMP data provider.
    - Each cluster displays the storyline or topic that ties its members together and the trend of mention frequency or company breadth.
    - The trader can move from a cluster into a side-by-side chart inspection of its members.
    - The workflow stays distinct from theme confirmation and does not imply a cluster is already a theme.
  architecture_options:
    - id: A1
      title: Lightweight discovery view
      description: >
        Add a read-only narrative-cluster view that consumes precomputed narrative findings
        and renders clusters, topic summaries, and trend indicators in the existing workspace UI.
      tradeoffs: >
        Lowest implementation effort and fastest path to validation, but less flexible for later
        workflow expansion.
    - id: A2
      title: Stateful narrative-cluster workspace
      description: >
        Introduce a dedicated narrative-cluster workspace with persisted cluster records,
        trend history, and explicit actions for chart inspection and theme creation.
      tradeoffs: >
        Better long-term flexibility and auditability, but requires more data model and workflow design.
  implementation_options:
    - id: I1
      title: Read-only first slice
      description: >
        Deliver the first version as a read-only surface over already available narrative findings,
        with cluster sorting and chart-launch actions.
      tradeoffs: >
        Faster to ship and easier to validate, but it leaves cluster editing and persistence for a later story.
    - id: I2
      title: End-to-end workflow slice
      description: >
        Deliver the discovery view plus cluster persistence, topic-trend history, and theme-conversion entry points.
      tradeoffs: >
        Stronger end-to-end value, but higher implementation complexity and more review surface area.
  repository_context: >
    The repository currently contains methodology documentation, backlog scaffolding, and
    no implemented narrative-cluster discovery capability.
  current_implementation: >
    No narrative-cluster discovery surface exists yet. The current implementation work is
    limited to documentation and backlog management.
  guidelines:
    - Use the canonical terms human trader, Technical Trader Solution, narrative cluster, storyline, topic, and theme.
    - Keep the workflow framed as discovery and assessment rather than automated theme confirmation.
    - Prefer implementation choices that make the side-by-side chart inspection path explicit.
  impact_analysis:
    - The feature improves early discovery of unlabeled or emerging themes that may not yet show pair-bond or sync signals.
    - It introduces a new user workflow that should remain clearly separated from theme creation and chart-based validation.
    - It may increase the need for data quality controls around narrative extraction and topic-trend calculations.
  development_cycle:
    - Confirm the selected architecture and implementation direction.
    - Implement the selected approach, validate it with a workflow walkthrough, and record any follow-up scope.
  open_questions: []
